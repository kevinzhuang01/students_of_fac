    and compiler optimization. I am particularly focused on understanding how large
    language models (LLMs) can analyze and optimize compiler intermediate representations
    (IRs) to improve program resilience, scalability, and efficiency in HPC environments.
    Working with Dr. Hailong Jiang, I have contributed to projects such as eHAPPA
    and HAPPA, which apply parameter-efficient tuning methods (e.g., LoRA) and representation
    learning to predict fault resilience and enhance code reliability. Our recent
    work, Can Large Language Models Understand Intermediate Representations?, investigates
    LLMs’ ability to reason over structured program semantics—a step toward integrating
    AI-driven reasoning into software optimization pipelines. Beyond systems-level
    AI, I also explore human-centered applications, using LLMs to model personality,
    emotion, and mental health from real-world language data. My long-term goal is
    to bridge computational systems and behavioral modeling, advancing both the theoretical
    understanding and practical deployment of trustworthy, adaptive AI across domains.
