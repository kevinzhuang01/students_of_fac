    of Maryland, Baltimore County (UMBC), where I work under the guidance of Dr. Tejas
    Gokhale in the Cognitive Vision Group. I received my Masters in Computer Science
    from UMBC and Bachelor of Science from BRAC University in Bangladesh. My research
    focuses on advancing the capabilities of computer vision systems by addressing
    challenges in interactive video retrieval, visual reasoning, and video understanding.
    In the area of interactive video retrieval, search, and understanding, I explore
    methods that integrate vision-language models (VLMs), scene-graph reasoning, dialogue-driven
    interaction and lessen the burden of human annotation. My goal is to make video
    retrieval more interactive and semantically aligned with human intent. My work
    on visual reasoning investigates spatial understanding, counterfactual inference,
    and visual editing, with the broader aim of improving interpretability, adaptability
    in AI models. This line of research seeks to push models beyond pattern recognition
    toward deeper semantic understanding. In Summer Camp for Applied Language Exploration
    (SCALE) 2024 at Johns Hopkins University, I have also worked in semantic video
    frame sampling, caption based video event localization to enhance event retrieval
    in multilingual video.
