  Please describe your research/academic interests.: 'I develop machine learning methods
    grounded in numerical analysis and robust statistics for high-stakes problems
    in finance, technology, energy, and (future) PK–PD. I embed Runge–Kutta discretizations
    into neural pipelines for stable learning of nonlinear dynamics, and use reinforcement
    learning and differentiable programming to synthesize control policies that honor
    system constraints. On the inference side, I focus on heavy-tailed robustness,
    kernel methods, and uncertainty quantification to handle distribution shift. I
    am interested in applying such frameworks to include portfolio optimization, systemic
    stress testing, and market microstructure in finance; forecasting and closed-loop
    control in technology and decentralized energy systems; and prospective optimal
    dosing in PK–PD via neural ODEs with safety-aware control. Across domains, my
    goal is the same: use mathematical structure to make ML systems reliable, interpretable,
    and ready for high-stakes deployment.'
